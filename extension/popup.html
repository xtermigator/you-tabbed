<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You Tabbed Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span><strong>You<span>Tabbed</span></strong></div>
      <p class="eyebrow">Browser companion</p>
      <h1>Sync your real tabs.</h1>
      <p class="copy">Your tabs stay in this browser. You Tabbed receives only the tab titles, URLs, and browser metadata you choose to show in the dashboard.</p>
      <div id="status" class="status">Checking dashboard…</div>
      <button id="sync" class="primary">Sync tabs now <span>→</span></button>
      <button id="open" class="secondary">Open dashboard</button>
      <p id="result" class="result" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
